# Supabase pausa los proyectos gratis tras 7 días sin actividad.
# Esta tarea hace una consulta mínima cada 3 días para mantenerlo activo.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 15 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar Supabase
        run: |
          node --input-type=module -e "
            const { SUPABASE_URL, SUPABASE_ANON_KEY } = await import('./public/js/config.js');
            const res = await fetch(SUPABASE_URL + '/rest/v1/settings?select=key&limit=1', {
              headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
            });
            console.log('Supabase respondió', res.status);
            if (!res.ok) process.exit(1);
          "
